<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carcassonne Tile Catalog</title>
    <link rel="stylesheet" href="catalog.css" />
  </head>
  <body>
    <main>
      <a href="index.html">← Scoring app</a>
      <p class="eyebrow">Z-Man Games · 2014 · Anne Pätzke artwork</p>
      <h1>Tile catalog review</h1>
      <p>Review the crop, segmentation mask, edge segments, connections, and detected features for each reference tile.</p>
      <div class="layout">
        <nav id="tile-list" aria-label="Tile selection"></nav>
        <section id="extraction-viewer" class="extraction-viewer" aria-labelledby="extraction-title">
          <div class="viewer-heading">
            <div>
              <p class="eyebrow">Model output</p>
              <h2 id="extraction-title">Extracted tile analysis</h2>
            </div>
            <span id="extraction-status" aria-live="polite"></span>
          </div>
          <div class="image-comparison">
            <figure>
              <img id="extracted-crop" alt="Cropped reference tile" />
              <figcaption>Cropped image</figcaption>
            </figure>
            <figure>
              <img id="extracted-mask" alt="Color-coded tile mask" />
              <figcaption>Segmentation mask</figcaption>
            </figure>
          </div>
          <div class="analysis-grid">
            <section>
              <h3>Edge segments</h3>
              <div id="extracted-edges" class="edge-review"></div>
            </section>
            <section>
              <h3>Connections</h3>
              <ul id="extracted-connections" class="analysis-list"></ul>
            </section>
            <section>
              <h3>Features</h3>
              <div id="extracted-features" class="feature-review"></div>
            </section>
          </div>
        </section>
      </div>
    </main>
    <script src="tile_library_z-man_2014/tile_analysis.js"></script>
    <script src="catalog.js"></script>
  </body>
</html>
